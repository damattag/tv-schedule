services:
  db:
    profiles:
      - local
      - development
    image: bitnami/mysql:8.4.5
    restart: unless-stopped
    ports:
      - ${DATABASE_PORT}:3306
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=${DATABASE_NAME}
      - MYSQL_USER=${DATABASE_USER}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - ./db/data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h127.0.0.1', '-P3306']
      interval: 5s
      timeout: 2s
      retries: 20

  db-test:
    profiles:
      - local
    image: bitnami/mysql:8.4.5
    restart: unless-stopped
    ports:
      - 3307:3306
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=${DATABASE_NAME}-test
      - MYSQL_USER=${DATABASE_USER}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}

  app:
    profiles:
      - development
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${API_PORT}:3001
    environment:
      - DATABASE_URL=mysql://root:${DATABASE_PASSWORD}@localhost:${DATABASE_PORT}/${DATABASE_NAME}
    depends_on:
      - db  